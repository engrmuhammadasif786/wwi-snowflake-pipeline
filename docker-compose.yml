services:
  dagster-webserver:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wwi-dagster-webserver
    entrypoint:
      - dagster-webserver
      - -h
      - "0.0.0.0"
      - -p
      - "3000"
      - -w
      - workspace.yaml
    ports:
      - "${DAGSTER_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      DAGSTER_HOME: /opt/dagster/dagster_home
      PYTHONPATH: /opt/dagster/app
    volumes:
      - ./dagster_wwi:/opt/dagster/app/dagster_wwi
      - ./dbt_wwi:/opt/dagster/app/dbt_wwi
      - ./data:/opt/dagster/app/data
      - dagster_home_data:/opt/dagster/dagster_home
    networks:
      - wwi-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/server_info"]
      interval: 15s
      timeout: 5s
      retries: 5

  dagster-daemon:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wwi-dagster-daemon
    entrypoint:
      - dagster-daemon
      - run
      - -w
      - workspace.yaml
    env_file:
      - .env
    environment:
      DAGSTER_HOME: /opt/dagster/dagster_home
      PYTHONPATH: /opt/dagster/app
    volumes:
      - ./dagster_wwi:/opt/dagster/app/dagster_wwi
      - ./dbt_wwi:/opt/dagster/app/dbt_wwi
      - ./data:/opt/dagster/app/data
      - dagster_home_data:/opt/dagster/dagster_home
    depends_on:
      dagster-webserver:
        condition: service_healthy
    networks:
      - wwi-network

volumes:
  dagster_home_data:

networks:
  wwi-network:
    driver: bridge
